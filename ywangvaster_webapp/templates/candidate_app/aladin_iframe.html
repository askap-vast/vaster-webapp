<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aladin Sky View</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    #aladin-lite-div {
      width: 100%;
      height: 100%;
    }
    #aladin-loading {
      position: absolute;
      inset: 0;
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      font-size: 0.9rem;
    }
    .spinner {
      width: 1.5rem;
      height: 1.5rem;
      border: 3px solid #dee2e6;
      border-top-color: #0d6efd;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="aladin-loading">
    Loading Aladin Lite plugin
    <div class="spinner"></div>
  </div>
  <div id="aladin-lite-div"></div>

  <script type="text/javascript" src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>
  <script>
    A.init.then(() => {
      document.getElementById('aladin-loading').style.display = 'none';
      let aladin = A.aladin('#aladin-lite-div', {
        showCooGridControl: true,
        showSimbadPointerControl: true,
        showCooGrid: false,
        survey: "P/DSS2/color",
        fov: 2 / 60,
        target: "{{ target }}",
      });
    });
  </script>
</body>
</html>
